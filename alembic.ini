# Alembic Configuration — ALGO Content Service
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = alembic

# sqlalchemy.url is intentionally blank — set via DATABASE_URL env var in env.py
# sqlalchemy.url =

# Templates for revision filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for file timestamps
timezone = UTC

# Max length for "slug" in filename
truncate_slug_length = 40

# Use single transaction per migration (safe for DDL in PostgreSQL)
transaction_per_migration = true

[post_write_hooks]
# No auto-formatting hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
